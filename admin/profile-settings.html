<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Ely's Blog Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <h2 class="brand-logo"><span class="logo-accent">EL</span> Journal</h2>
      <p class="admin-subtitle">ADMIN CMS</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        <span>Dashboard</span>
      </a>
      <a href="posts.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Posts</span>
      </a>
      <a href="categories.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Categories</span>
      </a>
      <a href="media.html" class="sidebar-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>Media</span>
      </a>
      <a href="profile-settings.html" class="sidebar-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html" class="sidebar-link" style="color: #EF4444;" id="admin-logout-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div></div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="admin-theme-btn" id="admin-theme-toggle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span>Dark Mode</span>
        </button>
        <div class="admin-profile-badge">
          <div class="avatar-circle">EL</div>
          <div style="display: flex; flex-direction: column;">
            <span class="admin-name">Ely</span>
            <span class="admin-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-content-body">
      <div style="margin-bottom: 24px;">
        <h1 style="font-size: 28px;">Profile Settings</h1>
        <p style="color: var(--text-muted); font-size: 14px;">Manage your account information and password.</p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr; gap: 24px; width: 100%;">
        <!-- Profile Info Form -->
        <div style="background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light); padding: 28px;">
          <h3 style="font-size: 18px; margin-bottom: 24px;">Profile Page Information</h3>
          <form id="profile-info-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Display Name</label>
                <input type="text" id="admin-name-input" class="input-field" placeholder="e.g. Elyssa Contreras" required />
              </div>
              <div class="form-group">
                <label class="form-label">Full Name (Quick Facts)</label>
                <input type="text" id="admin-fullname-input" class="input-field" placeholder="e.g. Ma. Elyssa Beda D. Contreras" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Role / Subtitle</label>
                <input type="text" id="admin-role-input" class="input-field" placeholder="e.g. BSIT 3rd Year Student" required />
              </div>
              <div class="form-group">
                <label class="form-label">Course</label>
                <input type="text" id="admin-course-input" class="input-field" placeholder="e.g. BS Information Technology" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">University / School</label>
                <input type="text" id="admin-school-input" class="input-field" placeholder="e.g. Father Saturnino Urios University" required />
              </div>
              <div class="form-group">
                <label class="form-label">Year Level</label>
                <input type="text" id="admin-yearlevel-input" class="input-field" placeholder="e.g. 3rd Year" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Motto / Tagline Quote</label>
              <input type="text" id="admin-motto-input" class="input-field" placeholder="e.g. Code. Create. Protect." required />
            </div>

            <div class="form-group">
              <label class="form-label">About Me Bio</label>
              <textarea id="admin-bio-input" class="input-field" rows="4" style="resize: vertical;" required></textarea>
            </div>

            <h4 style="font-size: 15px; margin: 24px 0 16px 0; color: var(--accent-coral);">Contact & Social Links</h4>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="admin-email-input" class="input-field" placeholder="e.g. ely.admin@elysblog.com" required />
              </div>
              <div class="form-group">
                <label class="form-label">Facebook Profile URL</label>
                <input type="text" id="admin-facebook-input" class="input-field" placeholder="https://facebook.com/username" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">GitHub Profile URL</label>
                <input type="text" id="admin-github-input" class="input-field" placeholder="https://github.com/username" />
              </div>
              <div class="form-group">
                <label class="form-label">Instagram Profile URL</label>
                <input type="text" id="admin-instagram-input" class="input-field" placeholder="https://instagram.com/username" />
              </div>
            </div>

            <h4 style="font-size: 15px; margin: 24px 0 16px 0; color: var(--accent-coral);">Profile Media</h4>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Avatar Image URL / Path</label>
                <input type="text" id="admin-avatar-input" class="input-field" placeholder="assets/images/profile-pfp.jpg" />
              </div>
              <div class="form-group">
                <label class="form-label">Cover Banner Image URL / Path</label>
                <input type="text" id="admin-cover-input" class="input-field" placeholder="assets/images/profile-cover.png" />
              </div>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 12px;">Save Profile Changes</button>
          </form>
        </div>

        <!-- Change Password Form -->
        <div style="background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light); padding: 28px;">
          <h3 style="font-size: 18px; margin-bottom: 24px;">Change Admin Password</h3>
          <form id="password-form">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" class="input-field" placeholder="Enter current password" required />
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" class="input-field" placeholder="Enter new password" required />
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="input-field" placeholder="Confirm new password" required />
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const data = getBlogData();
      const author = data.author || {};

      const nameInput = document.getElementById('admin-name-input');
      const fullNameInput = document.getElementById('admin-fullname-input');
      const roleInput = document.getElementById('admin-role-input');
      const courseInput = document.getElementById('admin-course-input');
      const schoolInput = document.getElementById('admin-school-input');
      const yearInput = document.getElementById('admin-yearlevel-input');
      const mottoInput = document.getElementById('admin-motto-input');
      const bioInput = document.getElementById('admin-bio-input');
      const emailInput = document.getElementById('admin-email-input');
      const facebookInput = document.getElementById('admin-facebook-input');
      const githubInput = document.getElementById('admin-github-input');
      const instagramInput = document.getElementById('admin-instagram-input');
      const avatarInput = document.getElementById('admin-avatar-input');
      const coverInput = document.getElementById('admin-cover-input');

      // Populate input values
      nameInput.value = author.name || 'Elyssa Contreras';
      fullNameInput.value = author.fullName || 'Ma. Elyssa Beda D. Contreras';
      roleInput.value = author.role || 'BSIT 3rd Year Student';
      courseInput.value = author.course || 'BS Information Technology';
      schoolInput.value = author.school || 'Father Saturnino Urios University';
      yearInput.value = author.yearLevel || '3rd Year';
      mottoInput.value = author.motto || 'Code. Create. Protect.';
      bioInput.value = author.bio || '';
      emailInput.value = author.email || 'ely.admin@elysblog.com';
      facebookInput.value = author.facebook || 'https://facebook.com/elycontz';
      githubInput.value = author.github || 'https://github.com/elypie';
      instagramInput.value = author.instagram || 'https://instagram.com/_beymm';
      avatarInput.value = (author.avatarUrl && !author.avatarUrl.includes('unsplash.com')) ? author.avatarUrl : 'assets/images/profile-pfp.jpg';
      coverInput.value = (author.coverUrl && !author.coverUrl.includes('unsplash.com')) ? author.coverUrl : 'assets/images/profile-cover.png';

      document.getElementById('profile-info-form').addEventListener('submit', (e) => {
        e.preventDefault();
        
        data.author = {
          ...data.author,
          name: nameInput.value,
          fullName: fullNameInput.value,
          role: roleInput.value,
          course: courseInput.value,
          school: schoolInput.value,
          yearLevel: yearInput.value,
          motto: mottoInput.value,
          bio: bioInput.value,
          email: emailInput.value,
          facebook: facebookInput.value,
          github: githubInput.value,
          instagram: instagramInput.value,
          avatarUrl: avatarInput.value,
          coverUrl: coverInput.value
        };

        saveBlogData(data);
        alert("Profile information updated successfully! Public profile page has been updated.");
      });

      document.getElementById('password-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert("Password updated successfully!");
      });
    });
  </script>
</body>
</html>
