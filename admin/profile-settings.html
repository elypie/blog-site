  <div class="admin-main">

    <header class="admin-topbar">

      <div></div>

      <div style="display: flex; align-items: center; gap: 16px;">

        <button class="admin-theme-btn" id="admin-theme-toggle">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>

          <span>Dark Mode</span>

        </button>

        <div class="admin-profile-badge">

          <div class="avatar-circle">EL</div>

          <div style="display: flex; flex-direction: column;">

            <span class="admin-name">Ely</span>

            <span class="admin-role">Administrator</span>

          </div>

        </div>

      </div>

    </header>



    <main class="admin-content-body">

      <div style="margin-bottom: 24px;">

        <h1 style="font-size: 28px;">Profile Settings</h1>

        <p style="color: var(--text-muted); font-size: 14px;">Manage your account information and password.</p>

      </div>



      <div style="display: grid; grid-template-columns: 1fr; gap: 24px; width: 100%;">

        <!-- Profile Info Form -->

        <div style="background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light); padding: 28px;">

          <h3 style="font-size: 18px; margin-bottom: 24px;">Profile Page Information</h3>

          <form id="profile-info-form">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">Display Name</label>

                <input type="text" id="admin-name-input" class="input-field" placeholder="e.g. Elyssa Contreras" required />

              </div>

              <div class="form-group">

                <label class="form-label">Full Name (Quick Facts)</label>

                <input type="text" id="admin-fullname-input" class="input-field" placeholder="e.g. Ma. Elyssa Beda D. Contreras" required />

              </div>

            </div>



            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">Role / Subtitle</label>

                <input type="text" id="admin-role-input" class="input-field" placeholder="e.g. BSIT 3rd Year Student" required />

              </div>

              <div class="form-group">

                <label class="form-label">Course</label>

                <input type="text" id="admin-course-input" class="input-field" placeholder="e.g. BS Information Technology" required />

              </div>

            </div>



            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">University / School</label>

                <input type="text" id="admin-school-input" class="input-field" placeholder="e.g. Father Saturnino Urios University" required />

              </div>

              <div class="form-group">

                <label class="form-label">Year Level</label>

                <input type="text" id="admin-yearlevel-input" class="input-field" placeholder="e.g. 3rd Year" required />

              </div>

            </div>



            <div class="form-group">

              <label class="form-label">About Me Bio</label>

              <textarea id="admin-bio-input" class="input-field" rows="4" style="resize: vertical;" required></textarea>

            </div>



            <h4 style="font-size: 15px; margin: 24px 0 16px 0; color: var(--accent-coral);">Contact & Social Links</h4>



            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">Email</label>

                <input type="email" id="admin-email-input" class="input-field" placeholder="e.g. ely.admin@elysblog.com" required />

              </div>

              <div class="form-group">

                <label class="form-label">Facebook Profile URL</label>

                <input type="text" id="admin-facebook-input" class="input-field" placeholder="https://facebook.com/username" />

              </div>

            </div>



            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">GitHub Profile URL</label>

                <input type="text" id="admin-github-input" class="input-field" placeholder="https://github.com/username" />

              </div>

              <div class="form-group">

                <label class="form-label">Instagram Profile URL</label>

                <input type="text" id="admin-instagram-input" class="input-field" placeholder="https://instagram.com/username" />

              </div>

            </div>



            <h4 style="font-size: 15px; margin: 24px 0 16px 0; color: var(--accent-coral);">Profile Media</h4>



            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">

              <div class="form-group">

                <label class="form-label">Avatar Image URL / Path</label>

                <input type="text" id="admin-avatar-input" class="input-field" placeholder="assets/images/profile-pfp.jpg" />

              </div>

              <div class="form-group">

                <label class="form-label">Cover Banner Image URL / Path</label>

                <input type="text" id="admin-cover-input" class="input-field" placeholder="assets/images/profile-cover.png" />

              </div>

            </div>



            <button type="submit" class="btn-primary" style="margin-top: 12px;">Save Profile Changes</button>

          </form>

        </div>



        <!-- Change Password Form -->

        <div style="background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light); padding: 28px;">

          <h3 style="font-size: 18px; margin-bottom: 24px;">Change Admin Password</h3>

          <form id="password-form">

            <div class="form-group">

              <label class="form-label">Current Password</label>

              <input type="password" class="input-field" placeholder="Enter current password" required />

            </div>

            <div class="form-group">

              <label class="form-label">New Password</label>

              <input type="password" class="input-field" placeholder="Enter new password" required />

            </div>

            <div class="form-group">

              <label class="form-label">Confirm New Password</label>

              <input type="password" class="input-field" placeholder="Confirm new password" required />

            </div>

            <button type="submit" class="btn-primary">Update Password</button>

          </form>

        </div>

      </div>

    </main>

  <script src="../assets/js/data.js"></script>

  <script type="module">
    import { db, auth } from '../assets/js/firebase-client.js';
    import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';

    const ADMIN_UID = 'ousMq8F19BaaioW9ltneiW2Gw2a2';
    const profileRef = doc(db, 'site_settings', 'author');
    const fields = {
      name: 'admin-name-input', fullName: 'admin-fullname-input',
      role: 'admin-role-input', course: 'admin-course-input',
      school: 'admin-school-input', yearLevel: 'admin-yearlevel-input',
      bio: 'admin-bio-input',
      email: 'admin-email-input', facebook: 'admin-facebook-input',
      github: 'admin-github-input', instagram: 'admin-instagram-input',
      avatarUrl: 'admin-avatar-input', coverUrl: 'admin-cover-input'
    };
    const defaults = {
      name: 'Elyssa Contreras', fullName: 'Ma. Elyssa Beda D. Contreras',
      role: 'BSIT 3rd Year Student', course: 'BS Information Technology',
      school: 'Father Saturnino Urios University', yearLevel: '3rd Year',
      motto: 'Code. Create. Protect.', bio: '', email: 'ely.admin@elysblog.com',
      facebook: 'https://facebook.com/elycontz', github: 'https://github.com/elypie',
      instagram: 'https://instagram.com/_beymm',
      avatarUrl: 'assets/images/profile-pfp.jpg',
      coverUrl: 'assets/images/profile-cover.png'
    };
    const profileForm = document.getElementById('profile-info-form');
    const passwordForm = document.getElementById('password-form');
    const saveButton = profileForm.querySelector('[type="submit"]');
    const passwordButton = passwordForm.querySelector('[type="submit"]');
    const themeButton = document.getElementById('admin-theme-toggle');
    profileForm.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
    passwordForm.querySelectorAll('input, button').forEach(el => el.disabled = true);

    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.body.classList.toggle('dark-theme', dark);
      themeButton.querySelector('span').textContent = dark ? 'Light Mode' : 'Dark Mode';
    }

    applyTheme(localStorage.getItem('elys_admin_theme') || 'dark');
    themeButton.addEventListener('click', () => {
      const next = (localStorage.getItem('elys_admin_theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('elys_admin_theme', next);
      applyTheme(next);
    });

    const scrollToTopButton = document.createElement('button');
    scrollToTopButton.id = 'scroll-to-top-btn';
    scrollToTopButton.className = 'scroll-to-top-btn';
    scrollToTopButton.setAttribute('aria-label', 'Scroll to top');
    scrollToTopButton.title = 'Scroll to top';
    scrollToTopButton.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';
    document.body.appendChild(scrollToTopButton);
    window.addEventListener('scroll', () => {
      scrollToTopButton.classList.toggle('is-visible', window.scrollY > 300);
    }, { passive: true });
    scrollToTopButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // Keep existing author details as fallback for the first Firestore save.
    function localAuthor() {
      try { return typeof getBlogData === 'function' ? (getBlogData().author || {}) : {}; }
      catch { return {}; }
    }
    function fillFields(author) {
      for (const [key, id] of Object.entries(fields)) {
        document.getElementById(id).value = author[key] ?? defaults[key] ?? '';
      }
    }
    function collectFields() {
      return Object.fromEntries(Object.entries(fields).map(([key, id]) =>
        [key, document.getElementById(id).value.trim()]));
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.uid !== ADMIN_UID) {
        window.location.replace('login.html');
        return;
      }
      try {
        const snapshot = await getDoc(profileRef);
        const local = localAuthor();
        // The initial Firestore document contains only name; use existing local fields for the rest.
        fillFields({ ...defaults, ...local, ...(snapshot.exists() ? snapshot.data() : {}) });
        profileForm.querySelectorAll('input, textarea, button').forEach(el => el.disabled = false);
        passwordForm.querySelectorAll('input, button').forEach(el => el.disabled = false);
        document.body.style.visibility = 'visible';
      } catch (error) {
        console.error('Could not load author profile:', error);
        document.body.style.visibility = 'visible';
        alert('Could not load your Firebase profile. Please check your connection and Firestore rules.');
      }
    });

    profileForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (auth.currentUser?.uid !== ADMIN_UID) return;
      saveButton.disabled = true;
      try {
        await setDoc(profileRef, collectFields(), { merge: true });
        alert('Profile changes saved to Firebase successfully!');
      } catch (error) {
        console.error('Could not save profile:', error);
        alert('Could not save your profile: ' + error.message);
      } finally {
        saveButton.disabled = false;
      }
    });

    passwordForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user || user.uid !== ADMIN_UID || !user.email) return;
      const inputs = passwordForm.querySelectorAll('input[type="password"]');
      const [currentPassword, newPassword, confirmPassword] = [...inputs].map(el => el.value);
      if (newPassword !== confirmPassword) {
        alert('New passwords do not match.');
        return;
      }
      if (newPassword.length < 6) {
        alert('Your new password must be at least 6 characters.');
        return;
      }
      passwordButton.disabled = true;
      try {
        const credential = EmailAuthProvider.credential(user.email, currentPassword);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPassword);
        passwordForm.reset();
        alert('Your Firebase admin password has been updated successfully.');
      } catch (error) {
        console.error('Could not update password:', error);
        alert('Password update failed: ' + error.message);
      } finally {
        passwordButton.disabled = false;
      }
    });

    // Firebase sign-out; do not rely on the old localStorage-only logout.
    const logout = document.getElementById('admin-logout-btn');
    logout.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      try {
        await signOut(auth);
        localStorage.removeItem('elys_admin_logged_in');
        window.location.replace('login.html');
      } catch (error) {
        alert('Logout failed: ' + error.message);
      }
    }, true);
  </script>
