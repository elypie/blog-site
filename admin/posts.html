      padding: 24px;
      color: var(--text-muted);

            <span class="admin-role">Administrator</span>

      </div>
    </header>

    <main class="admin-content-body">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 28px;">Posts</h1>
          <p style="color: var(--text-muted); font-size: 14px;">
            Manage and organize your blog posts.
          </p>
        </div>

        <a href="post-editor.html" class="btn-primary">
          Static Publishing Steps
        </a>
      </div>

      <!-- Posts Table -->
      <div style="background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light); padding: 24px;">

        <!-- Tabs -->
        <div style="display: flex; gap: 12px; margin-bottom: 24px;">
          <button class="table-tab-btn active" data-tab="all">
            All
          </button>
          <button class="table-tab-btn" data-tab="published">
            Published
          </button>
          <button class="table-tab-btn" data-tab="draft">
            Draft
          </button>
        </div>

        <table class="admin-table">
          <thead>
            <tr>
              <th>TITLE</th>
              <th>CATEGORY</th>
              <th>STATUS</th>
              <th>DATE</th>
              <th style="text-align: right;">ACTIONS</th>
            </tr>
          </thead>

          <tbody id="admin-posts-table-body">
            <tr>
              <td colspan="5" class="posts-message">
                Loading posts...
              </td>
            </tr>
          </tbody>
        </table>

      </div>

    </main>
  </div>

  <script src="../assets/js/data.js"></script>

  <!-- Firebase Authentication; posts come from the checked-in static data. -->
  <script type="module">

    import { auth } from '../assets/js/firebase-client.js';

    import {
      signOut
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';

    // Use the same UID as your working admin/login.html.
    const ADMIN_UID = 'ousMq8F19BaaioW9ltneiW2Gw2a2';

    const tableBody = document.getElementById('admin-posts-table-body');
    const tabs = document.querySelectorAll('.table-tab-btn');
    const logoutButton = document.getElementById('admin-logout-btn');
    const themeButton = document.getElementById('admin-theme-toggle');

    let allPosts = [];
    let activeTab = 'all';

    function redirectToLogin() {
      localStorage.removeItem('elys_admin_logged_in');
      localStorage.removeItem('elys_admin_user');
      window.location.replace('login.html');
    }

    function makeCell(text) {
      const cell = document.createElement('td');
      cell.textContent = text == null ? '' : String(text);
      return cell;
    }

    function formatDate(value) {
      if (!value) return '—';

      let date;

      if (typeof value.toDate === 'function') {
        date = value.toDate();
      } else if (typeof value === 'object' && value.seconds) {
        date = new Date(value.seconds * 1000);
      } else {
        date = new Date(value);
      }

      if (Number.isNaN(date.getTime())) return '—';

      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function showMessage(message) {
      tableBody.replaceChildren();

      const row = document.createElement('tr');
      const cell = makeCell(message);

      cell.colSpan = 5;
      cell.className = 'posts-message';

      row.appendChild(cell);
      tableBody.appendChild(row);
    }

    function renderPosts() {
      tableBody.replaceChildren();

      const filteredPosts = allPosts.filter(post => {
        const status = String(post.status || '').toLowerCase();

        return activeTab === 'all' || status === activeTab;
      });

      if (filteredPosts.length === 0) {
        showMessage('No posts found.');
        return;
      }

      filteredPosts.forEach(post => {
        const row = document.createElement('tr');

        row.appendChild(makeCell(post.title || 'Untitled'));

        row.appendChild(
          makeCell(
            post.categoryName ||
            post.category ||
            'Uncategorized'
          )
        );

        row.appendChild(makeCell(post.status || 'Draft'));

        row.appendChild(
          makeCell(
            formatDate(
              post.createdAt ||
              post.created_at ||
              post.date ||
              post.publishedAt
            )
          )
        );

        const actionsCell = document.createElement('td');
        actionsCell.style.textAlign = 'right';

        const editLink = document.createElement('a');
        editLink.href = 'post-editor.html';
        editLink.textContent = 'Edit';
        editLink.className = 'post-action-link';

        editLink.textContent = 'File steps';
        actionsCell.appendChild(editLink);

        const viewLink = document.createElement('a');
        viewLink.href = `../blog-detail.html?id=${encodeURIComponent(post.id)}`;
        viewLink.textContent = 'View';
        viewLink.className = 'post-action-link';
        actionsCell.appendChild(viewLink);

        row.appendChild(actionsCell);
        tableBody.appendChild(row);
      });
    }

    async function loadPosts() {
      showMessage('Loading posts...');

      try {
        allPosts = getBlogData().posts;

        renderPosts();

      } catch (error) {
        console.error('Unable to load posts:', error);
        showMessage('Unable to load static posts.');
      }
    }

    // Tabs
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;

        tabs.forEach(button => {
          button.classList.toggle('active', button === tab);
        });

        renderPosts();
      });
    });

    // Logout
    logoutButton.addEventListener('click', async (event) => {
      event.preventDefault();

      try {
        await signOut(auth);
        redirectToLogin();
      } catch (error) {
        console.error('Logout failed:', error);
        alert('Unable to log out. Please try again.');
      }
    });

    // Dark Mode
    const THEME_KEY = 'elys_admin_theme';

    function applyTheme(theme) {
      const isDark = theme === 'dark';

      document.documentElement.setAttribute(
        'data-theme',
        isDark ? 'dark' : 'light'
      );

      document.body.classList.toggle('dark-mode', isDark);

      const label = themeButton.querySelector('span');

      if (label) {
        label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
      }
    }

    applyTheme(localStorage.getItem(THEME_KEY) || 'light');

    themeButton.addEventListener('click', () => {
      const current = localStorage.getItem(THEME_KEY) || 'light';
      const next = current === 'dark' ? 'light' : 'dark';

      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    // Verify Firebase Authentication before showing the page.
    async function initialize() {
      try {
        await auth.authStateReady();

        if (
          ADMIN_UID === 'YOUR_FIREBASE_ADMIN_UID' ||
          !auth.currentUser ||
          auth.currentUser.uid !== ADMIN_UID
        ) {
          redirectToLogin();
          return;
        }

        document.body.style.visibility = 'visible';

        await loadPosts();

      } catch (error) {
        console.error('Posts page initialization failed:', error);
        redirectToLogin();
      }
    }

    initialize();

  </script>

</body>
