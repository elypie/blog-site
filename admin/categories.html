    <main class="admin-content-body">

              <th>CATEGORY NAME</th>

  <!-- Category Articles Modal -->

  <div class="editor-preview-modal" id="cat-posts-modal">

    <div class="editor-preview-card" style="max-width: 760px;">

      <div class="editor-preview-header">

        <div style="display: flex; align-items: center; gap: 10px;">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>

          <h3 style="font-size: 18px;" id="cat-modal-title">Posts in Category</h3>

        </div>

        <button type="button" class="btn-secondary" id="close-cat-modal-btn" style="padding: 6px 14px; font-size: 13px;">Close</button>

      </div>

      <div class="editor-preview-body" style="padding: 24px;">

        <div id="cat-posts-list-container"></div>

      </div>

    </div>

  </div>


  <script src="../assets/js/data.js"></script>
  <script type="module">
    import { auth, db } from '../assets/js/firebase-client.js';
    import { signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { collection, doc, getDocs, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { fetchCategoriesFromFirebase } from '../assets/js/firebase-data.js';

    // Replace with the same UID in your working admin/login.html.
    const ADMIN_UID = 'ousMq8F19BaaioW9ltneiW2Gw2a2';
    const tbody = document.getElementById('categories-table-body');
    const modal = document.getElementById('cat-posts-modal');
    const modalTitle = document.getElementById('cat-modal-title');
    const modalBody = document.getElementById('cat-posts-list-container');
    let categories = [];
    let posts = [];
    let busy = false;

    function loginRedirect() {
      localStorage.removeItem('elys_admin_logged_in');
      localStorage.removeItem('elys_admin_user');
      window.location.replace('login.html');
    }

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = String(text ?? '');
      return td;
    }

    function message(text) {
      tbody.replaceChildren();
      const tr = document.createElement('tr');
      const td = cell(text);
      td.colSpan = 3;
      td.style.cssText = 'text-align:center;padding:40px;color:var(--text-muted)';
      tr.append(td);
      tbody.append(tr);
    }

    function assignedPosts(name) {
      return posts.filter(p => String(p.category || '').trim().toLowerCase() === String(name).trim().toLowerCase());
    }

    function action(label, className, handler) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.className = className;
      button.style.cssText = 'padding:6px 14px;font-size:13px;';
      button.addEventListener('click', handler);
      return button;
    }

    function renderCategories() {
      tbody.replaceChildren();
      if (!categories.length) {
        message('No categories found. Click + Add Category to create one!');
        return;
      }
      for (const cat of categories) {
        const tr = document.createElement('tr');
        const nameTd = document.createElement('td');
        const clickable = document.createElement('div');
        clickable.style.cssText = 'display:flex;align-items:center;gap:12px;cursor:pointer;';
        const dot = document.createElement('span');
        dot.style.cssText = 'width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;';
        dot.style.backgroundColor = /^#[0-9a-f]{3,8}$/i.test(cat.color || '') ? cat.color : '#A5150C';
        const name = document.createElement('span');
        name.style.cssText = 'font-weight:700;font-size:15px;';
        name.textContent = cat.name;
        clickable.append(dot, name);
        clickable.addEventListener('click', () => viewPosts(cat));
        nameTd.append(clickable);

        const countTd = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge-status';
        badge.style.cssText = 'background:rgba(165,21,12,.08);color:var(--accent-coral);padding:4px 12px;border-radius:12px;font-size:13px;';
        badge.textContent = `${assignedPosts(cat.name).length} articles`;
        countTd.append(badge);

        const actionsTd = document.createElement('td');
        actionsTd.style.textAlign = 'right';
        const buttons = document.createElement('div');
        buttons.style.cssText = 'display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;';
        buttons.append(
          action('View Posts', 'btn-action-edit', () => viewPosts(cat)),
          action('Edit', 'btn-action-edit', () => editCategory(cat)),
          action('Delete', 'btn-action-delete', () => removeCategory(cat))
        );
        actionsTd.append(buttons);
        tr.append(nameTd, countTd, actionsTd);
        tbody.append(tr);
      }
    }

    function viewPosts(cat) {
      const matches = assignedPosts(cat.name);
      modalTitle.textContent = `${cat.name} Articles (${matches.length})`;
      modalBody.replaceChildren();
      if (!matches.length) {
        const empty = document.createElement('p');
        empty.style.cssText = 'text-align:center;padding:40px;color:var(--text-muted);';
        empty.textContent = 'No posts assigned to this category yet.';
        modalBody.append(empty);
      } else {
        const list = document.createElement('div');
        list.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
        for (const post of matches) {
          const item = document.createElement('div');
          item.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg-primary);border:1px solid var(--border-light);border-radius:12px;';
          const info = document.createElement('div');
          const heading = document.createElement('h4');
          heading.textContent = post.title || 'Untitled';
          heading.style.cssText = 'font-size:15px;font-weight:700;margin-bottom:4px;';
          const meta = document.createElement('div');
          meta.style.cssText = 'font-size:12px;color:var(--text-muted);';
          meta.textContent = `${post.date || ''} • ${post.status || 'Draft'}`;
          info.append(heading, meta);
          const edit = document.createElement('a');
          edit.className = 'btn-secondary';
          edit.style.cssText = 'padding:6px 12px;font-size:12px;white-space:nowrap;';
          edit.textContent = 'View Post';
          edit.href = '../blog-detail.html?id=' + encodeURIComponent(post.id);
          item.append(info, edit);
          list.append(item);
        }
        modalBody.append(list);
      }
      modal.classList.add('is-open');
    }

    // Locate the actual Firestore document ID, even if the imported data uses a different id field.
    async function categoryReference(cat) {
      const snapshot = await getDocs(collection(db, 'categories'));
      const found = snapshot.docs.find(s => String(s.data().id ?? s.id) === String(cat.id));
      if (!found) throw new Error('Category no longer exists in Firestore.');
      return found.ref;
    }

    async function addCategory() {
      if (busy) return;
      const raw = prompt('Enter new category name:');
      if (raw === null) return;
      const name = raw.trim();
      if (!name) return alert('Please enter a category name.');
      if (categories.some(c => c.name.toLowerCase() === name.toLowerCase())) return alert('That category already exists.');
      busy = true;
      try {
        const reference = doc(collection(db, 'categories'));
        await setDoc(reference, { id: reference.id, name, color: '#A5150C', count: 0 });
        categories = await fetchCategoriesFromFirebase();
        renderCategories();
      } catch (error) {
        console.error(error);
        alert('Could not add category: ' + error.message);
      } finally { busy = false; }
    }

    async function editCategory(cat) {
      if (busy) return;
      const raw = prompt('Edit category name:', cat.name);
      if (raw === null) return;
      const name = raw.trim();
      if (!name) return alert('Category name cannot be empty.');
      if (name === cat.name) return;
      if (categories.some(c => String(c.id) !== String(cat.id) && c.name.toLowerCase() === name.toLowerCase())) return alert('That category already exists.');
      // Renaming a category used by posts would require updating all those posts too.
      if (assignedPosts(cat.name).length) return alert('This category has posts. Reassign those posts before renaming it.');
      busy = true;
      try {
        const reference = await categoryReference(cat);
        await setDoc(reference, { ...cat, name }, { merge: true });
        categories = await fetchCategoriesFromFirebase();
        renderCategories();
      } catch (error) {
        console.error(error);
        alert('Could not edit category: ' + error.message);
      } finally { busy = false; }
    }

    async function removeCategory(cat) {
      if (busy) return;
      if (assignedPosts(cat.name).length) return alert('This category contains posts. Reassign those posts before deleting it.');
      if (!confirm(`Delete category "${cat.name}"?`)) return;
      busy = true;
      try {
        // Recheck posts immediately before deleting to reduce stale-data mistakes.
        if (assignedPosts(cat.name).length) throw new Error('This category now has posts. Reassign them first.');
        await deleteDoc(await categoryReference(cat));
        categories = await fetchCategoriesFromFirebase();
        renderCategories();
      } catch (error) {
        console.error(error);
        alert('Could not delete category: ' + error.message);
      } finally { busy = false; }
    }

    document.getElementById('add-cat-btn').addEventListener('click', addCategory);
    document.getElementById('close-cat-modal-btn').addEventListener('click', () => modal.classList.remove('is-open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('is-open'); });

    document.getElementById('admin-logout-btn').addEventListener('click', async e => {
      e.preventDefault();
      try { await signOut(auth); loginRedirect(); }
      catch (error) { alert('Logout failed. Please try again.'); }
    });

    const themeButton = document.getElementById('admin-theme-toggle');
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.body.classList.toggle('dark-mode', dark);
      themeButton.querySelector('span').textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    applyTheme(localStorage.getItem('elys_admin_theme') || 'light');
    themeButton.addEventListener('click', () => {
      const next = (localStorage.getItem('elys_admin_theme') || 'light') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('elys_admin_theme', next);
      applyTheme(next);
    });

    async function initialize() {
      try {
        await auth.authStateReady();
        if (ADMIN_UID === 'YOUR_FIREBASE_ADMIN_UID' || !auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
          loginRedirect();
          return;
        }
        document.body.style.visibility = 'visible';
        message('Loading categories...');
        posts = getBlogData().posts;
        categories = await fetchCategoriesFromFirebase();
        renderCategories();
      } catch (error) {
        console.error('Categories initialization error:', error);
        if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) loginRedirect();
        else { document.body.style.visibility = 'visible'; message('Could not load categories from Firebase.'); }
      }
    }
    initialize();
  </script>
