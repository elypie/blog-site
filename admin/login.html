<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Ely's Blog</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: var(--shadow-md);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #FDE8E3;
      color: var(--accent-coral);
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    .error-banner {
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .demo-credentials-note {
      margin-top: 24px;
      padding: 14px 16px;
      background-color: var(--badge-bg);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-avatar">EL</div>
        <h1 style="font-size: 24px; margin-bottom: 8px;">Admin Portal Login</h1>
        <p style="font-size: 14px; color: var(--text-muted);">Sign in to access your CMS Dashboard</p>
      </div>

      <div id="login-error" class="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="input-field" placeholder="Enter admin username" value="admin" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input-field" placeholder="Enter password" value="admin123" required />
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 15px;">Sign In to Dashboard</button>
      </form>

      <div class="demo-credentials-note">
        <strong>💡 Demo Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="../index.html" style="font-size: 13px; color: var(--text-muted); font-weight: 600;">← Back to Public Website</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect straight to dashboard
      if (localStorage.getItem('elys_admin_logged_in') === 'true') {
        window.location.href = 'dashboard.html';
      }

      const loginForm = document.getElementById('login-form');
      const errorBanner = document.getElementById('login-error');

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        // Accept 'admin' or 'ely' with valid password
        if ((username.toLowerCase() === 'admin' || username.toLowerCase() === 'ely') && (password === 'admin123' || password === 'admin' || password === 'ely123')) {
          localStorage.setItem('elys_admin_logged_in', 'true');
          localStorage.setItem('elys_admin_user', username);
          window.location.href = 'dashboard.html';
        } else {
          errorBanner.style.display = 'block';
          errorBanner.textContent = 'Invalid username or password. Please use default credentials below.';
        }
      });
    });
  </script>
</body>
</html>
