<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Library Explorer - Admin CMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    .explorer-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .explorer-crumb {
      cursor: pointer;
      color: var(--accent-coral);
      transition: opacity 0.2s ease;
    }
    .explorer-crumb:hover {
      text-decoration: underline;
    }
    .explorer-crumb-active {
      color: var(--text-main);
      cursor: default;
    }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .folder-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      position: relative;
    }
    .folder-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-coral);
    }
    .folder-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(165, 21, 12, 0.12);
      color: var(--accent-coral);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .folder-details {
      flex: 1;
      min-width: 0;
    }
    .folder-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .folder-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .media-file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
    }
    .file-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-coral);
    }
    .file-thumb-wrap {
      width: 100%;
      height: 150px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }
    .file-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .file-card:hover .file-thumb-img {
      transform: scale(1.04);
    }
    .file-info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .file-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    .file-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .file-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }
    .file-btn {
      flex: 1;
      padding: 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-light);
      background: var(--bg-primary);
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .file-btn:hover {
      background: var(--accent-coral-light);
      color: var(--accent-coral);
      border-color: var(--accent-coral);
    }

    .explorer-upload-zone {
      border: 2px dashed var(--border-light);
      border-radius: 18px;
      padding: 32px 20px;
      text-align: center;
      background: var(--bg-card);
      cursor: pointer;
      transition: border-color var(--transition-fast), background 0.2s ease;
      margin-bottom: 28px;
    }
    .explorer-upload-zone:hover {
      border-color: var(--accent-coral);
      background: var(--accent-coral-light);
    }

    /* Lightbox Modal */
    .media-lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .media-lightbox-modal.is-open {
      display: flex;
    }
    .media-lightbox-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      max-width: 680px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="admin-body">

      <h2 class="brand-logo"><span class="logo-accent">EL</span> Journal</h2>

    <div class="sidebar-footer">
      <a href="login.html" class="sidebar-link" style="color: #EF4444;" id="admin-logout-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

  <!-- Admin Main Section -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div></div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="admin-theme-btn" id="admin-theme-toggle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span>Dark Mode</span>
        </button>
        <div class="admin-profile-badge">
          <div class="avatar-circle">EL</div>
          <div style="display: flex; flex-direction: column;">
            <span class="admin-name">Ely</span>
            <span class="admin-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-content-body">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 28px;">Media Library Explorer</h1>
          <p style="color: var(--text-muted); font-size: 14px;">Organize and manage media assets in structured folders.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <input type="text" id="media-search-input" class="input-field" placeholder="Search media files..." style="width: 240px; font-size: 13px;" />
          <button class="btn-primary" id="upload-media-btn">+ Upload File</button>
        </div>
      </div>

      <!-- Breadcrumbs Navigation Bar -->
      <div class="explorer-breadcrumbs" id="explorer-breadcrumbs">
        <span class="explorer-crumb explorer-crumb-active" onclick="navigateToFolder('root')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent-coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Media Library
        </span>
      </div>

      <!-- Main Explorer Container -->
      <div id="explorer-view-container"></div>
    </main>
  </div>

  <!-- Media Lightbox / Action Modal -->
  <div class="media-lightbox-modal" id="media-lightbox-modal">
    <div class="media-lightbox-card">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between;">
        <h3 style="font-size: 16px; font-weight: 800;" id="lightbox-filename">Media Preview</h3>
        <button class="btn-secondary" id="close-lightbox-btn" style="padding: 4px 12px; font-size: 12px;">Close</button>
      </div>
      <div style="padding: 20px; text-align: center; background: var(--bg-primary);">
        <img id="lightbox-img-preview" src="" alt="" style="max-width: 100%; max-height: 380px; border-radius: 12px; object-fit: contain; box-shadow: var(--shadow-sm);" />
      </div>
      <div style="padding: 16px 20px; background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12px; color: var(--text-muted);" id="lightbox-filepath">assets/images/...</span>
        <button class="btn-primary" id="lightbox-copy-btn" style="padding: 6px 14px; font-size: 12px;">📋 Copy Path</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Explorer Folders Schema & File Registry
      const initialMediaData = {
        folders: [
          {
            id: 'profile',
            name: 'Profile Images',
            path: 'assets/images/profile/',
            description: 'Avatars, logos, and identity cutout graphics',
            icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
            files: [
              { id: 1, name: 'profile-pfp.jpg', path: 'assets/images/profile/profile-pfp.jpg', size: '222 KB', date: 'Aug 5, 2026', type: 'JPG' },
              { id: 2, name: 'ely-cutout.png', path: 'assets/images/profile/ely-cutout.png', size: '70 KB', date: 'Aug 5, 2026', type: 'PNG' },
              { id: 3, name: 'ely-hero-card.png', path: 'assets/images/profile/ely-hero-card.png', size: '182 KB', date: 'Aug 5, 2026', type: 'PNG' }
            ]
          },
          {
            id: 'covers',
            name: 'Cover Images',
            path: 'assets/images/profile/',
            description: 'Profile headers and site showcase banners',
            icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
            files: [
              { id: 4, name: 'profile-cover.png', path: 'assets/images/profile/profile-cover.png', size: '683 KB', date: 'Aug 5, 2026', type: 'PNG' }
            ]
          },
          {
            id: 'posts',
            name: 'Blog Cover Images',
            path: 'assets/images/posts/',
            description: 'Featured cover photos assigned to blog posts',
            icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
            files: [
              { id: 5, name: 'post1-cover.png', path: 'assets/images/posts/post1-cover.png', size: '340 KB', date: 'Aug 5, 2026', type: 'PNG' }
            ]
          },
          {
            id: 'other',
            name: 'Other Assets',
            path: 'assets/images/other/',
            description: 'Miscellaneous graphics, icons, and media files',
            icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
            files: []
          }
        ]
      };

      // Load saved media registry or set default
      let mediaState = JSON.parse(localStorage.getItem('elys_media_explorer_state')) || initialMediaData;

      function saveMediaState() {
        localStorage.setItem('elys_media_explorer_state', JSON.stringify(mediaState));
      }

      let currentFolderId = 'root';
      const container = document.getElementById('explorer-view-container');
      const breadcrumbEl = document.getElementById('explorer-breadcrumbs');
      const searchInput = document.getElementById('media-search-input');
      const uploadBtn = document.getElementById('upload-media-btn');

      const lightboxModal = document.getElementById('media-lightbox-modal');
      const lightboxImg = document.getElementById('lightbox-img-preview');
      const lightboxFilename = document.getElementById('lightbox-filename');
      const lightboxFilepath = document.getElementById('lightbox-filepath');
      const lightboxCopyBtn = document.getElementById('lightbox-copy-btn');
      const closeLightboxBtn = document.getElementById('close-lightbox-btn');

      window.navigateToFolder = function(folderId) {
        currentFolderId = folderId;
        renderExplorer();
      };

      function renderBreadcrumbs() {
        const folderSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent-coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
        if (currentFolderId === 'root') {
          breadcrumbEl.innerHTML = `<span class="explorer-crumb explorer-crumb-active">${folderSvg} Media Library</span>`;
        } else {
          const folder = mediaState.folders.find(f => f.id === currentFolderId);
          breadcrumbEl.innerHTML = `
            <span class="explorer-crumb" onclick="navigateToFolder('root')">${folderSvg} Media Library</span>
            <span style="color: var(--text-muted);">/</span>
            <span class="explorer-crumb explorer-crumb-active">${folder ? folder.name : 'Folder'}</span>
          `;
        }
      }

      function renderExplorer() {
        renderBreadcrumbs();
        const searchQuery = searchInput.value.trim().toLowerCase();

        // If searching across all files
        if (searchQuery !== '') {
          let allMatchingFiles = [];
          mediaState.folders.forEach(folder => {
            folder.files.forEach(file => {
              if (file.name.toLowerCase().includes(searchQuery) || file.path.toLowerCase().includes(searchQuery)) {
                allMatchingFiles.push({ ...file, folderName: folder.name });
              }
            });
          });

          if (allMatchingFiles.length === 0) {
            container.innerHTML = `
              <div style="padding: 60px 20px; text-align: center; color: var(--text-muted); background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-light);">
                <h3>No Media Files Found</h3>
                <p style="font-size: 13px; margin-top: 4px;">No files matching "${searchQuery}".</p>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 16px;">Search Results (${allMatchingFiles.length})</h3>
            <div class="media-file-grid">
              ${allMatchingFiles.map(file => renderFileCard(file)).join('')}
            </div>
          `;
          return;
        }

        // ROOT VIEW: Display Folders First
        if (currentFolderId === 'root') {
          container.innerHTML = `
            <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 16px;">Folders</h3>
            <div class="folder-grid">
              ${mediaState.folders.map(folder => `
                <div class="folder-card" onclick="navigateToFolder('${folder.id}')">
                  <div class="folder-icon-box">
                    ${folder.icon}
                  </div>
                  <div class="folder-details">
                    <div class="folder-title">${folder.name}</div>
                    <div class="folder-count">${folder.files.length} file${folder.files.length === 1 ? '' : 's'}</div>
                  </div>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          // INSIDE FOLDER VIEW: Upload dropzone + File Grid
          const folder = mediaState.folders.find(f => f.id === currentFolderId);
          if (!folder) { navigateToFolder('root'); return; }

          container.innerHTML = `
            <!-- Dropzone for direct folder upload -->
            <div class="explorer-upload-zone" id="folder-upload-dropzone">
              <input type="file" id="folder-file-input" style="display: none;" accept="image/*" />
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent-coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <h4 style="font-size: 15px; margin-bottom: 2px;">Upload Image into ${folder.name}</h4>
              <p style="font-size: 12px; color: var(--text-muted);">Click or drag & drop JPG, PNG, WEBP files</p>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
              <h3 style="font-size: 16px; font-weight: 800;">Files in ${folder.name} (${folder.files.length})</h3>
            </div>

            ${folder.files.length === 0 ? `
              <div style="padding: 40px; text-align: center; color: var(--text-muted); background: var(--bg-card); border-radius: 18px; border: 1px solid var(--border-light);">
                <p style="font-size: 14px; font-weight: 600;">This folder is empty.</p>
                <p style="font-size: 12px; margin-top: 4px;">Upload images above to add files to ${folder.name}.</p>
              </div>
            ` : `
              <div class="media-file-grid">
                ${folder.files.map(file => renderFileCard(file)).join('')}
              </div>
            `}
          `;

          // Folder file upload listener
          const dropzone = document.getElementById('folder-upload-dropzone');
          const fileInput = document.getElementById('folder-file-input');
          if (dropzone && fileInput) {
            dropzone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
              if (e.target.files.length > 0) handleUploadFile(e.target.files[0], folder.id);
            });
          }
        }
      }

      function renderFileCard(file) {
        const relativeImgPath = file.path.startsWith('http') || file.path.startsWith('data:') ? file.path : '../' + file.path;
        return `
          <div class="file-card">
            <div class="file-thumb-wrap" onclick="openLightbox('${file.name}', '${relativeImgPath}', '${file.path}')">
              <img src="${relativeImgPath}" alt="${file.name}" class="file-thumb-img" loading="lazy" />
            </div>
            <div class="file-info">
              <div>
                <div class="file-name" title="${file.name}">${file.name}</div>
                <div class="file-meta">${file.size || 'Image File'} • ${file.date || 'Recent'}</div>
              </div>
              <div class="file-actions">
                <button class="file-btn" onclick="openLightbox('${file.name}', '${relativeImgPath}', '${file.path}')">Preview</button>
                <button class="file-btn" onclick="copyFilePath('${file.path}')">Copy URL</button>
                <button class="file-btn" onclick="deleteFile(${file.id})" style="color: #EF4444;">Delete</button>
              </div>
            </div>
          </div>
        `;
      }

      function handleUploadFile(file, folderId) {
        if (!file.type.startsWith('image/')) {
          alert('Please select an image file.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
          const folder = mediaState.folders.find(f => f.id === folderId);
          if (folder) {
            const newFile = {
              id: Date.now(),
              name: file.name,
              path: evt.target.result,
              size: (file.size / 1024).toFixed(0) + ' KB',
              date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
              type: file.name.split('.').pop().toUpperCase()
            };
            folder.files.unshift(newFile);
            saveMediaState();
            renderExplorer();
          }
        };
        reader.readAsDataURL(file);
      }

      window.openLightbox = function(name, src, path) {
        lightboxFilename.textContent = name;
        lightboxImg.src = src;
        lightboxFilepath.textContent = path;
        lightboxCopyBtn.onclick = () => copyFilePath(path);
        lightboxModal.classList.add('is-open');
      };

      window.copyFilePath = function(path) {
        navigator.clipboard.writeText(path);
        alert(`Image path copied to clipboard:\n${path}`);
      };

      window.deleteFile = function(fileId) {
        if (confirm('Are you sure you want to delete this image?')) {
          mediaState.folders.forEach(folder => {
            folder.files = folder.files.filter(f => f.id !== fileId);
          });
          saveMediaState();
          renderExplorer();
        }
      };

      if (closeLightboxBtn) {
        closeLightboxBtn.addEventListener('click', () => {
          lightboxModal.classList.remove('is-open');
        });
      }

      if (uploadBtn) {
        uploadBtn.addEventListener('click', () => {
          const activeFolder = currentFolderId === 'root' ? 'posts' : currentFolderId;
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = (e) => {
            if (e.target.files.length > 0) handleUploadFile(e.target.files[0], activeFolder);
          };
          input.click();
        });
      }

      searchInput.addEventListener('input', renderExplorer);

      // Initial Render
      renderExplorer();
    });
  </script>
</body>
</html>
