<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Blogs - EL Journal</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    .search-input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-input:hover {
      border-color: var(--accent-coral);
    }
    .search-input:focus {
      border-color: var(--accent-coral);
      box-shadow: var(--shadow-focus);
    }
    .filter-pill {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      cursor: pointer;
    }
    .filter-pill.active {
      background-color: var(--accent-coral);
      color: #FFFFFF;
      border-color: var(--accent-coral);
    }
    .blog-item-card {
      display: grid;
      grid-template-columns: 260px 1fr;
      background-color: var(--bg-card-secondary);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: 24px;
      cursor: pointer;
    }
    .item-content-box {
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
    }
    .item-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .item-summary {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .item-meta-row {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .btn-read-more {
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-coral);
    }
  </style>
</head>
<body>

  <header class="public-header">
    <div class="container header-container">
      <div class="logo-section">
        <a href="index.html" class="brand-logo"><span class="logo-accent">EL</span> Journal</a>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="blogs.html" class="nav-link active">Blogs</a>
        <a href="profile.html" class="nav-link">Profile</a>
      </nav>
      <div class="header-actions nav-actions">
        <button class="icon-btn theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="fade-in-page" style="padding: 40px 0 80px 0;">
    <div class="container">
      <h1 style="font-size: 32px; margin-bottom: 24px;">All Blogs</h1>

      <input type="text" id="blog-search-input" class="search-input" placeholder="Search blog..." />

      <div id="category-pills-wrap" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px;"></div>

      <div id="public-blogs-list"></div>
    </div>
  </main>

  <!-- Quick Search Modal Overlay -->
  <div id="quick-search-overlay" class="quick-search-overlay" aria-hidden="true">
    <div class="quick-search-modal" role="dialog" aria-modal="true" aria-label="Search articles">
      <div class="quick-search-header">
        <svg class="quick-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="quick-search-input" class="quick-search-input" placeholder="Search blog posts by title, tag, or topic..." autocomplete="off" />
        <button type="button" id="quick-search-close" class="quick-search-close">ESC</button>
      </div>
      <div id="quick-search-results" class="quick-search-results">
        <!-- Results rendered dynamically via JS -->
      </div>
      <div class="quick-search-footer">
        <span>Press <kbd style="font-family: inherit; font-size: 11px; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-light);">↑</kbd> <kbd style="font-family: inherit; font-size: 11px; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-light);">↓</kbd> to navigate</span>
        <span>Press <kbd style="font-family: inherit; font-size: 11px; background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-light);">ESC</kbd> to close</span>
