<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Reader - EL Journal</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .back-link-btn {
      color: var(--accent-coral);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .article-header { margin-bottom: 32px; }
    .article-title { font-size: 40px; margin: 16px 0; }
    .article-subtitle { font-size: 18px; color: var(--text-muted); margin-bottom: 24px; }
    .article-meta-row { padding-top: 16px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-muted); }
    .article-cover-wrapper { width: 100%; max-height: 480px; border-radius: 24px; overflow: hidden; margin-bottom: 48px; }
    .article-cover-img { width: 100%; height: 100%; object-fit: cover; }
    
    .article-reader-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .article-body h3 { font-size: 24px; margin: 32px 0 16px 0; color: var(--text-main); }
    .article-body p { margin-bottom: 20px; color: var(--text-main); font-size: 16px; line-height: 1.8; opacity: 0.92; }
    
    /* Clean Collapsible Table of Contents Component */
    .toc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 22px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .toc-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-group {
      border-radius: 10px;
      transition: background 0.2s ease;
    }
    .toc-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }
    .toc-group-header:hover {
      background: rgba(165, 21, 12, 0.05);
    }
    .toc-chevron-btn {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }
    .toc-chevron-btn:hover {
      background: rgba(165, 21, 12, 0.1);
      color: var(--accent-coral);
    }
    .toc-group.expanded .toc-chevron-btn {
      transform: rotate(90deg);
      color: var(--accent-coral);
    }
    .toc-chevron-spacer {
      width: 20px;
      flex-shrink: 0;
    }
    .toc-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.45;
      transition: color 0.2s ease, font-weight 0.2s ease;
      flex: 1;
    }
    .toc-link.parent-link {
      font-weight: 600;
      color: var(--text-main);
    }
    .toc-link.child-link {
      font-size: 13px;
      color: var(--text-muted);
    }
    .toc-link:hover {
      color: var(--accent-coral) !important;
    }
    .toc-link.active {
      color: var(--accent-coral) !important;
      font-weight: 700 !important;
    }
    .toc-group-header.active-header .toc-link.parent-link {
      color: var(--accent-coral) !important;
      font-weight: 700 !important;
    }
    .toc-sublist {
      list-style: none;
      padding: 0 0 0 28px;
      margin: 2px 0 6px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.25s ease;
    }
    .toc-group.expanded .toc-sublist {
      max-height: 1000px;
      opacity: 1;
    }

    /* Mobile Collapsible TOC */
    details.mobile-toc-details {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    details.mobile-toc-details summary {
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      user-select: none;
      list-style: none;
    }
    details.mobile-toc-details summary::-webkit-details-marker {
      display: none;
    }
    details.mobile-toc-details[open] summary {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
    }

    /* Floating Back to Top Button */
    .back-to-top-btn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-coral);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(165, 21, 12, 0.35);
      opacity: 0;
      visibility: hidden;
      transform: translateY(16px);
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease, background 0.2s ease, box-shadow 0.2s ease;
      z-index: 9999;
    }
    .back-to-top-btn.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .back-to-top-btn:hover {
      background: var(--accent-coral-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(165, 21, 12, 0.45);
    }
    .back-to-top-btn:active {
      transform: translateY(0);
    }

    .author-info-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .author-avatar-circle { width: 48px; height: 48px; border-radius: 50%; background: #FDE8E3; color: var(--accent-coral); font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .author-name { font-size: 16px; font-weight: 800; }
    .author-role { font-size: 12px; color: var(--text-muted); }
    .author-bio { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    .mobile-only-block {
      display: none;
    }

    @media (max-width: 900px) {
      .article-content-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
      .desktop-sidebar-only { display: none !important; }
      .mobile-only-block { display: block !important; }
      .back-to-top-btn {
        bottom: 24px;
        right: 24px;
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
