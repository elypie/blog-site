<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Reader - EL Journal</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .back-link-btn {
      color: var(--accent-coral);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .article-header { margin-bottom: 32px; }
    .article-title { font-size: 40px; margin: 16px 0; }
    .article-subtitle { font-size: 18px; color: var(--text-muted); margin-bottom: 24px; }
    .article-meta-row { padding-top: 16px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-muted); }
    .article-cover-wrapper { width: 100%; max-height: 480px; border-radius: 24px; overflow: hidden; margin-bottom: 48px; }
    .article-cover-img { width: 100%; height: 100%; object-fit: cover; }
    
    .article-content-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 48px;
    }
    .article-body h3 { font-size: 24px; margin: 32px 0 16px 0; color: var(--text-main); }
    .article-body p { margin-bottom: 20px; color: var(--text-main); font-size: 16px; line-height: 1.8; opacity: 0.92; }
    
    .toc-card, .author-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .toc-title, .author-card-heading { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .toc-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .toc-item-link { font-size: 14px; color: var(--text-muted); }
    .toc-item-link:hover { color: var(--accent-coral); }
    
    .author-info-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .author-avatar-circle { width: 48px; height: 48px; border-radius: 50%; background: #FDE8E3; color: var(--accent-coral); font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .author-name { font-size: 16px; font-weight: 800; }
    .author-role { font-size: 12px; color: var(--text-muted); }
    .author-bio { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    @media (max-width: 900px) {
      .article-content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="public-header">
    <div class="container header-container">
      <div class="logo-section">
        <a href="index.html" class="brand-logo"><span class="logo-accent">EL</span> Journal</a>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="blogs.html" class="nav-link active">Blogs</a>
        <a href="profile.html" class="nav-link">Profile</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="theme-btn">🌙</button>
      </div>
    </div>
  </header>

  <main id="article-detail-root" style="padding: 40px 0 80px 0;"></main>

  <!-- Image Lightbox Modal -->
  <div id="image-lightbox-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; cursor: zoom-out;" onclick="this.style.display='none'">
    <img id="lightbox-modal-img" src="" alt="Full view" style="max-width: 90vw; max-height: 90vh; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); object-fit: contain;" />
    <button onclick="document.getElementById('image-lightbox-modal').style.display='none'" style="position: absolute; top: 24px; right: 24px; background: rgba(255,255,255,0.2); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
  </div>
