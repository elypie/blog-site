<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to EL Journal</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body class="dark-theme" style="margin: 0; padding: 0; overflow: hidden; background-color: #0D0C11;">

  <!-- Standalone Welcome Screen Page (Not an Overlay) -->
  <div id="welcome-screen-container">
    <div class="welcome-content">
      <div class="welcome-icons-row">
        <div class="welcome-icon-box" title="Journal / Blog">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="welcome-icon-box" title="Code / Development">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="welcome-icon-box" title="UI/UX Design">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m4.93 4.93 4.24 4.24"></path>
            <path d="m14.83 9.17 4.24-4.24"></path>
            <path d="m14.83 14.83 4.24 4.24"></path>
            <path d="m9.17 14.83-4.24 4.24"></path>
          </svg>
        </div>
      </div>
      <div class="welcome-title-subtitle">Welcome To</div>
      <h1 class="welcome-title-main">EL JOURNAL WEBSITE</h1>
      <div class="welcome-badge">
        <span>✨ Personal Blog • Developer • UI/UX Enthusiast</span>
      </div>
      <div class="welcome-progress-wrap">
        <div class="welcome-progress-track">
          <div class="welcome-progress-fill" id="welcome-progress-bar"></div>
        </div>
        <div class="welcome-loading-text" id="welcome-loading-txt">Loading.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
  <script src="assets/js/particles-bg.js"></script>
  <script>
    (function () {
      'use strict';

      // 1. Progress Bar & Auto-Redirect to index.html
      const progressBar = document.getElementById('welcome-progress-bar');
      const loadingTxt = document.getElementById('welcome-loading-txt');

      let progress = 0;
      const duration = 5600; // 5.6 seconds fill time
      const startTime = performance.now();

      const dots = ['Loading.', 'Loading..', 'Loading...'];
      let dotIdx = 0;
      const dotInterval = setInterval(() => {
        dotIdx = (dotIdx + 1) % dots.length;
        if (loadingTxt) loadingTxt.textContent = dots[dotIdx];
      }, 400);

      function animateProgress(currentTime) {
        const elapsed = currentTime - startTime;
        progress = Math.min((elapsed / duration) * 100, 100);

        if (progressBar) {
          progressBar.style.width = `${progress}%`;
        }

        if (progress < 100) {
          requestAnimationFrame(animateProgress);
        } else {
          clearInterval(dotInterval);
          if (loadingTxt) loadingTxt.textContent = 'Loading...';

          setTimeout(() => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 500);
          }, 300);
        }
      }

      requestAnimationFrame(animateProgress);
    })();
  </script>
</body>

</html>
